---
- name: Bootstrap PostgreSQL Ansible dependencies
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:

    - name: Install PostgreSQL client
      ansible.builtin.dnf:
        name: postgresql
        state: present

    - name: Install Python pip
      ansible.builtin.dnf:
        name: python3-pip
        state: present

    - name: Install psycopg2
      ansible.builtin.pip:
        name: psycopg2-binary
        state: present

    - name: Install community.postgresql collection
      ansible.builtin.command:
        cmd: ansible-galaxy collection install community.postgresql
      changed_when: false