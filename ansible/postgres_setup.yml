---
- name: Configure RAG PostgreSQL database
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    db_host: "{{ lookup('env', 'RDS_ENDPOINT') }}"
    db_port: "{{ lookup('env', 'RDS_PORT') | default('5432', true) }}"
    db_name: "{{ lookup('env', 'RDS_DATABASE') }}"
    db_user: "{{ lookup('env', 'RDS_USERNAME') }}"
    db_password: "{{ lookup('env', 'RDS_PASSWORD') }}"

  tasks:

    - name: Apply database schema from SQL file
      community.postgresql.postgresql_script:
        db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        path: "{{ playbook_dir }}/sql/schema.sql"
