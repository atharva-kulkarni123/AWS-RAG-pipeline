---
- name: Configure RAG PostgreSQL database
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    db_host: "{{ lookup('env', 'RDS_ENDPOINT') }}"
    db_port: "{{ lookup('env', 'RDS_PORT') | default('5432', true) }}"
    db_name: "{{ lookup('env', 'RDS_DATABASE') }}"
    db_user: "{{ lookup('env', 'RDS_USERNAME') }}"
    db_password: "{{ lookup('env', 'RDS_PASSWORD') }}"

  tasks:

    - name: Enable pgvector extension
      community.postgresql.postgresql_ext:
        name: vector
        db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        state: present

    - name: Create document_chunks table
      community.postgresql.postgresql_query:
        db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query: |
          CREATE TABLE IF NOT EXISTS document_chunks (
              id BIGSERIAL PRIMARY KEY,
              content TEXT NOT NULL,
              embedding VECTOR(1024),
              source TEXT,
              page_number INT
          );

    - name: Create HNSW vector index
      community.postgresql.postgresql_query:
        db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query: |
          CREATE INDEX IF NOT EXISTS document_chunks_embedding_idx
          ON document_chunks
          USING hnsw (embedding vector_cosine_ops);
