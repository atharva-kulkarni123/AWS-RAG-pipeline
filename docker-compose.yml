version: "3.9"

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      # AWS — use your local profile in dev, Secrets Manager in prod
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ragdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Bedrock
      BEDROCK_LLM_MODEL: ${BEDROCK_LLM_MODEL}
      BEDROCK_EMBEDDING_MODEL: amazon.titan-embed-text-v2:0

      # RAG tuning
      TOP_K: 5
      RERANK_TOP_K: 3
      SIMILARITY_THRESHOLD: 0.75

      # Cognito — leave blank locally to skip auth
      COGNITO_USER_POOL_ID: ""
      COGNITO_APP_CLIENT_ID: ""

      # Set to "true" to hide /docs in production
      HIDE_DOCS: "false"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s